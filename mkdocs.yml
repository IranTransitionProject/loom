site_name: Heddle
site_description: Turn what you know into testable AI steps. Chain them into workflows. Scale when ready.
site_url: https://getheddle.github.io/heddle/
repo_url: https://github.com/getheddle/heddle
repo_name: getheddle/heddle

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

# Internal build/tooling docs that should not appear in the published site.
exclude_docs: |
  diagrams/README.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

nav:
  - Home: index.md
  - User Guide:
    - Concepts: CONCEPTS.md
    - Getting Started: GETTING_STARTED.md
    - Why Heddle: WHY_HEDDLE.md
    - Workshop Tour: WORKSHOP_TOUR.md
    - Configuration: CONFIG.md
    - CLI Reference: CLI_REFERENCE.md
    - Workers Reference: workers-reference.md
    - RAG How-To: rag-howto.md
    - Building Workflows: building-workflows.md
    - Batch Processing: batch-processing.md
    - Multi-Agent Councils: council-howto.md
    - Adversarial Review: BLIND_AUDIT.md
    - Workshop Architecture: workshop.md
    - Troubleshooting: TROUBLESHOOTING.md
  - Tutorials:
    - Research Review Pipeline: tutorials/research-review.md
    - Document Intake Pipeline: tutorials/document-intake.md
  - Architecture:
    - Overview: ARCHITECTURE.md
    - Design Invariants: DESIGN_INVARIANTS.md
  - Vision:
    - Ad-Hoc Clusters: vision/AD_HOC_CLUSTERS.md
  - Deployment:
    - Local Deployment: LOCAL_DEPLOYMENT.md
    - Application Deployment: APP_DEPLOYMENT.md
    - Kubernetes: KUBERNETES.md
  - API Reference:
    - Core: api/core.md
    - Message Bus: api/bus.md
    - Worker: api/worker.md
    - Orchestrator: api/orchestrator.md
    - Router: api/router.md
    - Scheduler: api/scheduler.md
    - MCP: api/mcp.md
    - Tracing: api/tracing.md
    - Contrib: api/contrib.md
  - Development:
    - Contributing: CONTRIBUTING.md
    - Coding Guide: CODING_GUIDE.md
