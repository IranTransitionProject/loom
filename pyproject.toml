[project]
name = "heddle-ai"
version = "0.9.2"
description = "Config-driven multi-LLM workflow framework — define workers in YAML, chain them into pipelines, evaluate and scale"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Iran Transition Project", email = "admin@irantransitionproject.org"},
]
keywords = ["llm", "ai", "agents", "multi-agent", "orchestration", "nats", "rag", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.7.0",          # NATS client (async)
    "pydantic>=2.5.0",         # Message schemas and validation
    "pyyaml>=6.0",             # Config files
    "httpx>=0.27.0",           # HTTP client for LLM API calls
    "tiktoken>=0.7.0",         # Token counting for context management
    "click>=8.1.0",            # CLI
    "structlog>=24.1.0",       # Structured logging
]

[project.urls]
Homepage = "https://github.com/getheddle/heddle"
Documentation = "https://getheddle.github.io/heddle/"
Repository = "https://github.com/getheddle/heddle"
Issues = "https://github.com/getheddle/heddle/issues"

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",            # Redis-backed checkpoint store (async)
]
local = [
    "ollama>=0.3.0",           # Local model client
]
docproc = [
    "docling>=2.0.0",          # Document extraction (PDF, DOCX, etc.)
]
duckdb = [
    "duckdb>=1.0.0",           # Embedded analytics database
]
rag = [
    "duckdb>=1.0.0",           # Vector store backend
    "requests>=2.31.0",        # Ollama HTTP calls from LLM analyzers
]
lancedb = [
    "lancedb>=0.15.0",         # LanceDB embedded vector database
    "pyarrow>=15.0.0",         # Arrow for LanceDB schema
]
telegram = [
    "telethon>=1.36.0",        # Telegram MTProto client for live capture
]
scheduler = [
    "croniter>=2.0.0",         # Cron expression parsing for scheduled dispatch
]
mcp = [
    "fastmcp>=3.1",            # FastMCP — high-level MCP server/client framework
]
workshop = [
    "fastapi>=0.110.0",        # Web framework for Workshop UI
    "uvicorn>=0.27.0",         # ASGI server
    "jinja2>=3.1.6",           # Template engine
    "python-multipart>=0.0.9", # Form handling
    "duckdb>=1.0.0",           # Eval/version storage
]
mdns = [
    "zeroconf>=0.131.0",       # mDNS/Bonjour service discovery on LAN
]
otel = [
    "opentelemetry-api>=1.20.0",           # Tracing API (spans, context)
    "opentelemetry-sdk>=1.20.0",           # SDK (TracerProvider, export pipeline)
    "opentelemetry-exporter-otlp>=1.20.0", # OTLP gRPC exporter
]
tui = [
    "textual>=3.0.0",                     # Terminal UI framework (Textualize)
    "nats-py>=2.7.0",                     # Direct NATS subscription for live view
]
docs = [
    "mkdocs-material>=9.5",           # MkDocs with Material theme
    "mkdocstrings[python]>=0.24",     # Auto-generate API docs from docstrings
]
eval = [
    "deepeval>=3.8.0",         # LLM output quality evaluation (pytest metrics)
]
council = [
    # No new deps — reuses core (pydantic, yaml, httpx, structlog)
]
chatbridge = [
    "openai>=1.0.0",           # OpenAI Chat Completions client
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "duckdb>=1.0.0",
    "redis>=5.0.0",            # Needed for contrib/redis tests
    "croniter>=2.0.0",         # Needed for scheduler tests
    "fastmcp>=3.1",            # Needed for MCP gateway tests
    "lancedb>=0.15.0",         # Needed for contrib/lancedb tests
    "pyarrow>=15.0.0",         # Needed for LanceDB
    "mkdocs-material>=9.5",           # Needed for docs build
    "mkdocstrings[python]>=0.24",
    "deepeval>=3.8.0",         # LLM output quality evaluation
]

[project.scripts]
heddle = "heddle.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Register custom markers so pytest does not emit "PytestUnknownMarkWarning".
# Usage:  pytest tests/ -m "not integration"   (skip integration tests)
#         pytest tests/ -m integration          (run only integration tests)
markers = [
    "integration: requires running infrastructure (NATS, workers, Ollama)",
    "deepeval: LLM output quality evaluation tests (requires Ollama or LLM API)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["heddle"]
branch = true

[tool.coverage.report]
show_missing = true
# Total-line coverage gate. Per-package floors are documented in
# docs/CODING_GUIDE.md (pytest-cov does not natively gate per package).
fail_under = 91
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — undefined names, unused imports, etc.
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — import sorting
    "N",      # pep8-naming — class/function/variable naming conventions
    "UP",     # pyupgrade — enforce modern Python syntax (3.11+)
    "B",      # flake8-bugbear — likely bugs and design problems
    "A",      # flake8-builtins — shadowing Python builtins
    "C4",     # flake8-comprehensions — unnecessary list/dict/set comprehension
    "SIM",    # flake8-simplify — simplifiable constructs
    "TC",     # flake8-type-checking — move imports behind TYPE_CHECKING
    "RUF",    # Ruff-specific rules
    "D",      # pydocstyle — docstring conventions
    "ANN",    # flake8-annotations — missing type annotations
    "PT",     # flake8-pytest-style — pytest best practices
    "RET",    # flake8-return — unnecessary return/else/elif
    "ARG",    # flake8-unused-arguments — unused function arguments
    "PL",     # pylint — subset of pylint rules
    "PERF",   # perflint — performance anti-patterns
    "LOG",    # flake8-logging — logging best practices
    "T20",    # flake8-print — disallow print() in production code
]
ignore = [
    # --- Docstring style conflicts ---
    "D100",   # Missing docstring in public module (we have module docstrings, enforce via review)
    "D104",   # Missing docstring in public package (__init__.py)
    "D203",   # One blank line before class docstring (conflicts with D211)
    "D212",   # Multi-line summary on first line (we use """\n on its own line — D211)
    "D107",   # Missing docstring in __init__ (class docstring suffices)
    "D105",   # Missing docstring in magic method (__aiter__, __anext__ — obvious from ABC)

    # --- Type annotations ---
    "ANN401", # Dynamically typed Any allowed (common in message-passing across actor boundaries)

    # --- Arguments ---
    "ARG002", # Unused method argument (common in ABC/interface implementations)

    # --- Pylint ---
    "PLR0913",# Too many arguments — orchestrator/worker constructors legitimately need them
    "PLR2004",# Magic value comparison — acceptable in tests and config validation

    # --- Bugbear ---
    "B008",   # Function call in default arg (Click uses this pattern extensively)

    # --- Imports ---
    "PLC0415",# import not at top of file — Heddle uses conditional imports for optional deps
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # Docstrings not required in tests
    "ANN",    # Type annotations not required in tests
    "ARG",    # Unused arguments OK in tests (fixtures, parametrize)
    "T20",    # print() OK in tests
    "PLR",    # Pylint complexity rules relaxed in tests
    "SIM105", # contextlib.suppress — try/except/pass is clearer in tests
    "SIM115", # Open without context manager — OK in test helpers
    "PT011",  # pytest.raises too broad — acceptable for unit tests
    "B007",   # Unused loop variable — common in tests (for _ in range)
    "RUF059", # Unused unpacked variable — common in test assertions
    "RUF012", # Mutable class variable without ClassVar — OK in test classes
    "PERF102",# Unnecessary dict key check — clarity > perf in tests
    "RET504", # Unnecessary assignment before return — clarity in tests
]
"src/heddle/cli/**/*.py" = [
    "T20",    # print() OK in CLI commands (user-facing output)
    "ANN",    # Click decorators make annotation enforcement noisy
]
"src/heddle/workshop/app.py" = [
    "ANN",    # FastAPI route handlers — types inferred from dependencies
]
"examples/**/*.py" = [
    "T20",    # print() OK in examples (user-facing output)
    "D",      # Docstrings relaxed in examples
    "ANN",    # Type annotations relaxed in examples
    "TC001",  # TYPE_CHECKING imports not required in examples
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["heddle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.rumdl]
exclude = [".venv", "node_modules", "site"]
disable = [
    "MD013",  # line-length — docs use natural line breaks, not hard-wrapped at 80
    "MD024",  # duplicate-heading — repeated "Prerequisites", "Troubleshooting" across sections
    "MD034",  # no-bare-urls — bare URLs in config examples and quick references
    "MD036",  # no-emphasis-as-heading — bold text as pseudo-headings in some docs
    "MD041",  # first-line-heading — some reference docs don't start with H1
    "MD042",  # no-empty-links — status badges use empty link targets
]

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD029]
style = "ordered"

[tool.pyright]
# Gated type-check surface — only the four "hot path" packages per the
# 2026-05 repository review (Phase 3 §1). Other packages are deliberately
# excluded for now; widen this list in follow-up sessions as the type
# coverage matures. typeCheckingMode is intentionally "basic" — the first
# pass surfaces obvious bugs without drowning in nominally-typed dynamism.
include = [
    "src/heddle/core",
    "src/heddle/bus",
    "src/heddle/worker",
    "src/heddle/orchestrator",
]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Reduce noise from optional/contrib imports until we widen the surface.
reportMissingImports = "warning"

[tool.hatch.build.targets.wheel]
packages = ["src/heddle"]
