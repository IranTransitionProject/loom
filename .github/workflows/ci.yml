name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ``version`` pins the rumdl binary to a known release so a new rule
      # introduced in 0.2.x doesn't turn the lint-md job red mid-PR.
      # Bump this manually with awareness; ``.rumdl.toml`` is the source
      # of truth for which rules are enabled / disabled.
      - uses: rvben/rumdl@v0
        with:
          version: 0.1.91
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Ruff lint (src + tests)
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v -m "not integration and not deepeval" \
            --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra docs
      - name: Build API documentation
        run: uv run mkdocs build --strict

  audit:
    # Dependency vulnerability scan. Fails when pip-audit finds any CVE
    # with a fix available — except those baselined in
    # .github/pip-audit-ignore.txt. See docs/CODING_GUIDE.md
    # "Dependency security" for how to maintain the baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install all extras
        run: uv sync --all-extras
      - name: pip-audit (with baselined ignores)
        run: |
          set -euo pipefail
          ignores=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line//[[:space:]]/}"
            [[ -z "$line" ]] && continue
            ignores+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignore.txt
          uv run --with pip-audit pip-audit "${ignores[@]}"

