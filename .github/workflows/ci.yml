name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # ``version`` pins the rumdl binary to a known release so a new rule
      # introduced in 0.2.x doesn't turn the lint-md job red mid-PR.
      # Bump this manually with awareness; ``.rumdl.toml`` is the source
      # of truth for which rules are enabled / disabled.
      - uses: rvben/rumdl@v0
        with:
          version: 0.1.91
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Ruff lint (src + tests)
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Exported schemas in sync with Pydantic models
        # Drift between schemas/v1/*.schema.json and the live
        # TaskMessage / TaskResult / OrchestratorGoal / CheckpointState
        # Pydantic models would silently desynchronize the foreign-
        # language SDKs (.NET, Swift, etc.) from the canonical wire
        # format.  This step fails the build on drift; the fix is to
        # run ``uv run python tools/export_schemas.py`` locally and
        # commit the regenerated files.  See docs/foreign-actors.md
        # for the rationale.
        run: uv run python tools/export_schemas.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v -m "not integration and not deepeval" \
            --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra docs
      - name: Build API documentation
        run: uv run mkdocs build --strict

  typecheck:
    # Pyright on the gated runtime packages (core, bus, worker, orchestrator).
    # Configuration lives under [tool.pyright] in pyproject.toml. The surface
    # is intentionally narrow today; widen it in follow-up sessions as the
    # type coverage matures. See docs/CODING_GUIDE.md "Type checking".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install all extras
        run: uv sync --all-extras
      - name: Pyright (gated dirs only)
        run: uv run --with pyright pyright

  audit:
    # Dependency vulnerability scan. Fails when pip-audit finds any CVE
    # with a fix available — except those baselined in
    # .github/pip-audit-ignore.txt. See docs/CODING_GUIDE.md
    # "Dependency security" for how to maintain the baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install all extras
        run: uv sync --all-extras
      - name: pip-audit (with baselined ignores)
        run: |
          set -euo pipefail
          ignores=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line//[[:space:]]/}"
            [[ -z "$line" ]] && continue
            ignores+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignore.txt
          uv run --with pip-audit pip-audit "${ignores[@]}"

